<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Nuestras Finanzas</title>
  <meta name="theme-color" content="#1a8fe8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="img/icono-180.png">
  <link rel="icon" href="img/icono-192.png">
  <link rel="stylesheet" href="css/aero.css">
</head>
<body>
  <div class="cielo" aria-hidden="true">
    <span class="burbuja b1"></span><span class="burbuja b2"></span><span class="burbuja b3"></span>
    <span class="burbuja b4"></span><span class="burbuja b5"></span>
  </div>

  <header class="barra">
    <img src="img/icono-192.png" alt="" class="barra-logo">
    <div class="barra-titulo">Nuestras <b>Finanzas</b></div>
    <div id="quien-chip" class="chip-persona"></div>
  </header>

  <main id="vista" class="vista"></main>

  <nav id="nav" class="nav" hidden>
    <button data-tab="inicio" class="nav-btn"><span>🏡</span>Inicio</button>
    <button data-tab="casa" class="nav-btn"><span>🧺</span>Casa</button>
    <button data-accion="nuevo" class="nav-orbe" aria-label="Agregar"><span>+</span></button>
    <button data-tab="yo" class="nav-btn"><span id="nav-yo-ico">🙂</span><em id="nav-yo">Yo</em></button>
    <button data-tab="ajustes" class="nav-btn"><span>⚙️</span>Ajustes</button>
  </nav>

  <div id="hoja" class="hoja-fondo" hidden></div>
  <div id="avisos" class="avisos"></div>
  <input id="archivo" type="file" accept="image/*,audio/*" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
