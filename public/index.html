<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
  <title>Mort’s Finanzas</title>
  <meta name="theme-color" content="#1a8fe8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mort’s">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="img/icono-v2-180.png">
  <link rel="icon" href="img/icono-v2-192.png">
  <link rel="stylesheet" href="css/aero.css">
  <script>document.documentElement.dataset.fondo = localStorage.getItem('fondo') || 'depto';</script>
</head>
<body>
  <div class="cielo" aria-hidden="true">
    <span class="burbuja b1"></span><span class="burbuja b2"></span><span class="burbuja b3"></span>
    <span class="burbuja b4"></span><span class="burbuja b5"></span>
  </div>

  <header class="barra">
    <img src="img/icono-v2-192.png" alt="" class="barra-logo">
    <div class="barra-titulo">Mort’s <b>Finanzas</b></div>
    <button id="quien-chip" class="chip-persona" data-accion="ajustes" aria-label="Ajustes"></button>
  </header>

  <!-- La única navegación: la casa o lo mío -->
  <div id="lados" class="lados" hidden>
    <button data-lado="casa" class="lado on">🏠 La casa</button>
    <button data-lado="mio" id="lado-mio" class="lado">🔒 Lo mío</button>
  </div>

  <main id="vista" class="vista"></main>

  <!-- Detalle de época: pase de imágenes de la época: lobito, cerdito, peces y Mort -->
  <footer class="acuario" aria-hidden="true">
    <div class="galeria">
      <img src="img/lobo2.jpg" alt="" width="480" height="480">
      <img src="img/cerdito.jpg" alt="" width="480" height="480" loading="lazy">
      <img src="img/peces.jpg" alt="" width="480" height="480" loading="lazy">
      <img src="img/lemur.jpg" alt="" width="480" height="480" loading="lazy">
    </div>
    <p class="acuario-pie">Mort’s Finanzas · ahorrando de a poquito</p>
  </footer>

  <!-- Chat: las respuestas aparecen acá -->
  <div id="chat" class="chat-fondo" hidden>
    <div class="chat vidrio">
      <div class="chat-top"><b>💬 Anotador</b><button class="x" data-accion="cerrar-chat" aria-label="Cerrar">✕</button></div>
      <div id="chat-lista" class="chat-lista"></div>
    </div>
  </div>

  <!-- Barra de abajo, como WhatsApp -->
  <form id="form-chat" class="redactor" autocomplete="off">
    <button type="button" class="redactor-btn mas-btn" data-accion="manual" aria-label="Anotar con botones">＋</button>
    <input id="entrada" placeholder="Escribí un gasto…" enterkeyhint="send">
    <button type="button" class="redactor-btn" data-accion="captura" aria-label="Mandar captura o audio">📷</button>
    <button type="button" id="btn-mic" class="redactor-btn mic" aria-label="Grabar audio">🎤</button>
  </form>

  <div id="hoja" class="hoja-fondo" hidden></div>
  <div id="avisos" class="avisos"></div>
  <input id="archivo" type="file" accept="image/*,audio/*" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
